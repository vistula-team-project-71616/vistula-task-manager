<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Task Manager</h1>
            <p>Student ID: <span id="student-id">71616</span></p>
        </header>

        <main>

            <section class="task-form-section">
                <h2>Add a new task</h2>

                <form id="task-form">
                    <input
                        type="text"
                        id="task-title"
                        placeholder="Task title"
                        required
                    >

                    <textarea
                        id="task-description"
                        placeholder="Task description"
                    ></textarea>

                    <button type="submit" id="task-submit">
                        Add Task
                    </button>
                </form>
            </section>

            <section class="tasks-section">
                <h2>My Tasks</h2>

                <div id="status-message"></div>

                <div id="task-list">
                    <!-- Tasks will be loaded here -->
                </div>
            </section>

        </main>

        <footer>
            <a href="contribution.html" id="contribution-link">
                Team Contribution
            </a>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
